name: Import requested related articles (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-related-articles-once.yml']
permissions:
  contents: write
concurrency:
  group: import-related-articles
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install PDF inspection tools if needed
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Record blocked v4 download as link-only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('refs/related_articles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data['articles']:
              if item['id'] == 'topchyi2026v4':
                  item['copy_policy'] = 'link_only'
                  item['access_note'] = 'Full text inspected through the web source; the GitHub-hosted importer received HTTP 403 on 15 October 2026. Keep the official PDF and DOI links; no binary archived.'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          path = Path('refs/README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('[PDF](pdfs/topchyi_2026_plafales_p_vs_np_v4.pdf)', '[Source PDF; not archived](https://www.preprints.org/frontend/manuscript/54550dfca2a8fc65314fc16a95f40bc5/download_pub)')
          note = '**Import access note (15 October 2026):** Preprints.org returned HTTP 403 to the GitHub-hosted importer. The v4 PDF is therefore linked, not archived. Its license and the limited comparison above remain documented separately from this download failure.'
          if note not in text:
              text += '\n' + note + '\n'
          path.write_text(text, encoding='utf-8')
          PY
      - name: Fetch licensed original PDFs and record provenance
        run: python3 -u scripts/fetch_related_articles.py
      - name: Verify archived bytes
        working-directory: refs/pdfs
        run: sha256sum --check SHA256SUMS
      - name: Commit only the requested literature archive and access notes
        run: |
          git add -- refs/pdfs refs/related_articles.json refs/README.md
          if git diff --cached --quiet; then
            echo 'The requested archive and access notes are already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive three licensed related papers with validation and SHA-256 provenance; record blocked v4 access'
          git pull --rebase origin main
          git push origin HEAD:main
