[project]
name = "pnp-check"
version = "0.1.0"
description = "Computational checks for the review of Topchyi's P = NP paper (September 2026)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnp_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
